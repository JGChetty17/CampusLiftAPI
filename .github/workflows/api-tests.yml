name: API Tests

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'CampusLift.API/**'
      - 'CampusLift.API.Tests/**'
      - '.github/workflows/api-tests.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'CampusLift.API/**'
      - 'CampusLift.API.Tests/**'
      - '.github/workflows/api-tests.yml'
  workflow_dispatch:

jobs:
  test:
    name: Run xUnit Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore CampusLift.API.Tests/CampusLift.API.Tests.csproj

      - name: Build
        run: dotnet build CampusLift.API.Tests/CampusLift.API.Tests.csproj --no-restore -c Release

      - name: Run API tests
        env:
          Supabase__Url: ${{ secrets.SUPABASE_URL }}
          Supabase__Key: ${{ secrets.SUPABASE_KEY }}
          Firebase__CredentialsJson: ${{ secrets.FIREBASE_CREDENTIALS_JSON }}
        run: |
          dotnet test CampusLift.API.Tests/CampusLift.API.Tests.csproj \
            --no-build \
            -c Release \
            --logger "trx;LogFileName=api-tests.trx" \
            --results-directory ./TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-results
          path: ./TestResults/*.trx

      - name: Publish test summary
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: API Test Results
          path: ./TestResults/*.trx
          reporter: dotnet-trx
